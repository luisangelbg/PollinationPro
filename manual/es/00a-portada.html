<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PollinationPro · Manual de usuario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../manual.css">
<style>
  .cover { background: #ffffff; }
  .cover text { font-kerning: normal; }
</style>
</head>
<body>

<section class="page cover" aria-label="Portada">
  <svg id="cover" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Portada del manual de PollinationPro: al centro, el año como un círculo, con el arco de la floración de una planta y el del vuelo de su abeja, y en medio una flor de cucurbitácea con una abeja de la calabaza; a los lados, seis sistemas de cultivo y sus visitantes con su nombre científico; abajo, cuatro viñetas del programa: la coocurrencia en una rejilla, los nichos en el espacio ambiental, el mapa de desajuste y la red de visitas."></svg>
</section>

<script>
/* The cover is drawn once, deterministically (fixed seed), as vector graphics:
   it prints sharp at any size and every illustration is original. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs, parent, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    (parent || svg).appendChild(n);
    return n;
  };
  const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20260927);
  const randn = () => { let u = 0, v = 0; while (!u) u = rng(); while (!v) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  const W = 850, H = 1100;
  const INK = '#1f5a3a', GRIS = '#5a6b7a', BLANCO = '#ffffff';
  const VERDE = '#2e7d4f', ORO = '#d99a1e', VIOLETA = '#7b5ea7', AZUL = '#2f6fb0', OXIDO = '#b8452f', TURQ = '#3aa39a', TIERRA = '#8a6a4a', ROSA = '#c0406a', OLIVA = '#8a9a2a', PIZARRA = '#5f6b86', HOJA = '#5a9a3a', PETALO = '#f3d35c';
  const f1 = v => (+v).toFixed(2);
  const poly = pts => 'M' + pts.map(([x, y]) => f1(x) + ' ' + f1(y)).join('L');
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  const defs = el('defs');
  const G = {};
  function grad(id, stops, attrs, linear) {
    const g = el(linear ? 'linearGradient' : 'radialGradient', Object.assign({ id }, attrs || {}), defs);
    stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a }, g));
    G[id] = `url(#${id})`;
  }
  grad('halo', [[0, '#fbf3df', 1], [0.55, '#f5f8f1', 1], [1, '#ffffff', 0]]);
  grad('petalo', [[0, '#fff6c8', 1], [0.7, PETALO, 1], [1, '#e2b93a', 1]]);
  grad('verde', [[0, VERDE, 0.28], [1, VERDE, 0.02]]);
  grad('oro', [[0, ORO, 0.3], [1, ORO, 0.02]]);

  el('rect', { x: 0, y: 0, width: W, height: H, fill: BLANCO });

  /* ---------------------------------------------------------------- the colours of the ten blocks */
  const BLOQUES = ['#1f5a3a', VERDE, ORO, VIOLETA, AZUL, OXIDO, TURQ, TIERRA, ROSA, OLIVA, PIZARRA, '#111111'];
  BLOQUES.forEach((c, i) => {
    el('rect', { x: f1(i * W / BLOQUES.length), y: 0, width: f1(W / BLOQUES.length + 0.5), height: 9, fill: c });
    el('rect', { x: f1(i * W / BLOQUES.length), y: H - 5, width: f1(W / BLOQUES.length + 0.5), height: 5, fill: c });
  });

  /* ---------------------------------------------------------------- title */
  const tb = el('g', { 'text-anchor': 'middle' });
  const t1 = el('text', { x: W / 2, y: 132, fill: INK, 'font-family': 'Cormorant, serif', 'font-size': 96, 'font-weight': 700, 'letter-spacing': 0.4 }, tb);
  el('tspan', {}, t1, 'Pollination');
  el('tspan', { fill: ORO, 'font-style': 'italic', 'font-weight': 600 }, t1, 'Pro');
  el('text', { x: W / 2, y: 210, fill: INK, 'font-family': 'Cormorant, serif', 'font-size': 50, 'font-weight': 600, 'letter-spacing': 0.8 }, tb, 'Manual de usuario');
  el('text', { x: W / 2, y: 254, fill: VERDE, 'font-family': 'Cormorant, serif', 'font-size': 46, 'font-style': 'italic', 'font-weight': 500, 'letter-spacing': 0.6 }, tb, 'User Manual');
  el('path', { d: 'M288 280 L 390 280 M 460 280 L 562 280', stroke: GRIS, 'stroke-width': 0.9 }, tb);
  [VERDE, ORO, VIOLETA, AZUL, ROSA].forEach((c, i) => el('circle', { cx: 405 + i * 10, cy: 280, r: 3.2, fill: c }, tb));
  el('text', { x: W / 2, y: 305, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 11, 'font-weight': 400, 'letter-spacing': 2.8 }, tb,
    'PLANTAS, POLINIZADORES Y SU SOLAPAMIENTO · PLANTS, POLLINATORS AND THEIR OVERLAP');

  /* ================================================================= the year as a circle
     The centrepiece is the question of the whole app: do the flower and its pollinator meet?
     A year clock with the months; on it, the flowering of a plant (green) and the flight of its
     bee (gold) as two circular densities, their mean dates as arrows, and the months they share
     shaded. In the middle, a cucurbit flower with a squash bee on it. */
  const CX = 425, CY = 590, R0 = 118, R1 = 176;
  el('circle', { cx: CX, cy: CY, r: 222, fill: G.halo });
  el('circle', { cx: CX, cy: CY, r: R1 + 26, fill: 'none', stroke: '#dfe7d8', 'stroke-width': 0.9, 'stroke-dasharray': '1.5 5', 'stroke-linecap': 'round' });
  el('circle', { cx: CX, cy: CY, r: R0, fill: '#ffffff', stroke: '#dfe7d8', 'stroke-width': 1 });
  const ang = d => (d - 0.5) / 365 * 2 * Math.PI - Math.PI / 2;        /* day of year → angle, 1 Jan at the top */
  const pt = (d, r) => [CX + r * Math.cos(ang(d)), CY + r * Math.sin(ang(d))];
  const MES = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const inicio = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
  inicio.forEach((d, m) => {
    const [x1, y1] = pt(d, R0), [x2, y2] = pt(d, R1 + 10);
    el('line', { x1: f1(x1), y1: f1(y1), x2: f1(x2), y2: f1(y2), stroke: '#e3eadc', 'stroke-width': 0.9 });
    const [tx, ty] = pt(d + 15, R1 + 22);
    el('text', { x: f1(tx), y: f1(ty + 3.5), 'text-anchor': 'middle', 'font-family': 'Jost, sans-serif', 'font-size': 10, 'font-weight': 500, fill: GRIS, 'letter-spacing': 1 }, null, MES[m]);
  });
  /* two von Mises–like calendars: flowering peaks in early September, flight in mid-August */
  const vm = (d, mu, k) => Math.exp(k * (Math.cos((d - mu) / 365 * 2 * Math.PI) - 1));
  const band = (mu, k, col, fill, r0, r1) => {
    const outer = [], inner = [];
    for (let d = mu - 150; d <= mu + 150; d += 2) { const v = vm(d, mu, k); if (v < 0.015) continue; outer.push(pt(d, r0 + (r1 - r0) * v)); inner.push(pt(d, r0)); }
    el('path', { d: poly(outer) + 'L' + poly(inner.reverse()).slice(1) + 'Z', fill, stroke: 'none' });
    el('path', { d: poly(outer), fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round' });
    const [mx1, my1] = pt(mu, r0 - 2), [mx2, my2] = pt(mu - 5, r0 - 13), [mx3, my3] = pt(mu + 5, r0 - 13);
    el('path', { d: poly([[mx1, my1], [mx2, my2], [mx3, my3]]) + 'Z', fill: col });
  };
  band(250, 6.5, VERDE, mix(VERDE, '#ffffff', 0.72), R0 + 4, R1 - 4);
  band(228, 8, ORO, mix(ORO, '#ffffff', 0.55), R0 + 4, R1 - 18);
  /* the shared months, as a thin arc outside */
  const arc = [];
  for (let d = 196; d <= 283; d += 2) arc.push(pt(d, R1 + 4));
  el('path', { d: poly(arc), fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' });
  const [ax, ay] = pt(262, R1 + 46);
  el('text', { x: f1(ax), y: f1(ay + 4), 'text-anchor': 'end', 'font-family': 'Cormorant, serif', 'font-style': 'italic', 'font-size': 15, fill: INK }, null, 'D = 0.79');
  /* mean-date arrows */
  const flecha = (d, r, col) => { const [x, y] = pt(d, r); el('line', { x1: CX, y1: CY, x2: f1(x), y2: f1(y), stroke: col, 'stroke-width': 1.6 }); el('circle', { cx: f1(x), cy: f1(y), r: 3.2, fill: col }); };
  /* the flower: five yellow lobed petals, the pale throat and the stigma */
  const fl = el('g', { transform: `translate(${CX} ${CY}) scale(0.78)` });
  for (let i = 0; i < 5; i++) {
    const a = i * 72 - 90;
    el('path', { d: 'M0 0 C -30 -22 -40 -66 -14 -88 C -6 -94 6 -94 14 -88 C 40 -66 30 -22 0 0Z', fill: G.petalo, stroke: '#c89a22', 'stroke-width': 1, transform: `rotate(${a + 90})` }, fl);
    el('path', { d: 'M0 -8 L0 -76', stroke: '#d6aa2c', 'stroke-width': 0.8, transform: `rotate(${a + 90})` }, fl);
  }
  el('circle', { cx: 0, cy: 0, r: 24, fill: '#f8e9a6', stroke: '#d9b240', 'stroke-width': 1 }, fl);
  for (let i = 0; i < 3; i++) el('ellipse', { cx: f1(9 * Math.cos(i * 2.094)), cy: f1(9 * Math.sin(i * 2.094)), rx: 8, ry: 6, fill: '#e2a92b', transform: `rotate(${i * 120} ${f1(9 * Math.cos(i * 2.094))} ${f1(9 * Math.sin(i * 2.094))})` }, fl);
  /* the squash bee on a petal: body, stripes, wings */
  const bee = el('g', { transform: `translate(${CX + 30} ${CY - 36}) rotate(-28) scale(0.85)` });
  el('ellipse', { cx: 0, cy: -12, rx: 16, ry: 9, fill: '#eef3f6', 'fill-opacity': 0.85, stroke: '#9fb3c0', 'stroke-width': 0.8, transform: 'rotate(-20 0 -12)' }, bee);
  el('ellipse', { cx: 6, cy: -12, rx: 14, ry: 8, fill: '#eef3f6', 'fill-opacity': 0.85, stroke: '#9fb3c0', 'stroke-width': 0.8, transform: 'rotate(18 6 -12)' }, bee);
  el('ellipse', { cx: 0, cy: 0, rx: 21, ry: 9.5, fill: '#c98a1a' }, bee);
  [-6, 2, 10].forEach(x => el('rect', { x, y: -9.5, width: 3.6, height: 19, fill: '#3a2a12', rx: 1.5 }, bee));
  el('circle', { cx: -22, cy: 0, r: 7, fill: '#3a2a12' }, bee);
  el('path', { d: 'M-27 -4 Q -38 -14 -44 -10 M-27 3 Q -38 10 -43 16', fill: 'none', stroke: '#3a2a12', 'stroke-width': 1.2 }, bee);
  /* the dotted flight path */
  el('path', { d: `M${CX + 104} ${CY - 58} C ${CX + 96} ${CY - 84} ${CX + 70} ${CY - 92} ${CX + 50} ${CY - 58}`, fill: 'none', stroke: ORO, 'stroke-width': 1.3, 'stroke-dasharray': '2 4', 'stroke-linecap': 'round' });
  /* legend under the clock */
  const lg = el('g', { 'font-family': 'Jost, sans-serif', 'font-size': 10, fill: GRIS });
  el('rect', { x: 318, y: 808, width: 14, height: 9, rx: 2, fill: mix(VERDE, '#ffffff', 0.5), stroke: VERDE }, lg);
  el('text', { x: 337, y: 816 }, lg, 'floración');
  el('rect', { x: 408, y: 808, width: 14, height: 9, rx: 2, fill: mix(ORO, '#ffffff', 0.4), stroke: ORO }, lg);
  el('text', { x: 427, y: 816 }, lg, 'vuelo');
  el('line', { x1: 470, y1: 812, x2: 486, y2: 812, stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' }, lg);
  el('text', { x: 491, y: 816 }, lg, 'meses en común');

  /* ---------------------------------------------------------------- six systems, three on each side */
  const SIS = [
    ['Sechium edule', 'Xenoglossa', VERDE], ['Coffea arabica', 'Melipona', TIERRA], ['Theobroma cacao', 'Forcipomyia', OXIDO],
    ['Solanum lycopersicum', 'Bombus', ROSA], ['Agave', 'Leptonycteris', PIZARRA], ['Persea americana', 'Apis mellifera', OLIVA],
  ];
  SIS.forEach(([pl, vi, col], i) => {
    const izq = i < 3, x = izq ? 108 : 742, y = 420 + (i % 3) * 150;
    const g = el('g', { 'text-anchor': 'middle' });
    el('circle', { cx: x, cy: y, r: 30, fill: mix(col, '#ffffff', 0.86), stroke: col, 'stroke-width': 1.2 }, g);
    /* a tiny flower and a tiny visitor */
    for (let k = 0; k < 5; k++) el('ellipse', { cx: f1(x - 7 + 8 * Math.cos(k * 1.2566)), cy: f1(y + 2 + 8 * Math.sin(k * 1.2566)), rx: 5, ry: 3.2, fill: mix(col, '#ffffff', 0.35), transform: `rotate(${k * 72} ${f1(x - 7 + 8 * Math.cos(k * 1.2566))} ${f1(y + 2 + 8 * Math.sin(k * 1.2566))})` }, g);
    el('circle', { cx: x - 7, cy: y + 2, r: 3, fill: col }, g);
    el('ellipse', { cx: x + 12, cy: y - 10, rx: 6, ry: 3.2, fill: '#3a2a12' }, g);
    el('ellipse', { cx: x + 11, cy: y - 15, rx: 4.5, ry: 2.4, fill: '#dfe9ef', transform: `rotate(-25 ${x + 11} ${y - 15})` }, g);
    el('text', { x, y: y + 50, 'font-family': 'Cormorant, serif', 'font-style': 'italic', 'font-size': 15.5, fill: INK }, g, pl);
    el('text', { x, y: y + 66, 'font-family': 'Jost, sans-serif', 'font-size': 9.5, fill: GRIS, 'letter-spacing': 0.5 }, g, '×');
    el('text', { x, y: y + 82, 'font-family': 'Cormorant, serif', 'font-style': 'italic', 'font-size': 15.5, fill: col }, g, vi);
  });

  /* ---------------------------------------------------------------- four vignettes of the program */
  const VX0 = 70, VY = 862, VW = 150, VH = 96, VG = 20;
  function vignette(i, title) {
    const x = VX0 + i * (VW + VG);
    el('rect', { x, y: VY, width: VW, height: VH, rx: 8, fill: '#f7f9f5', stroke: '#dce6d8' });
    el('text', { x: x + VW / 2, y: VY + VH + 16, 'text-anchor': 'middle', 'font-family': 'Jost, sans-serif', 'font-size': 9.5, 'font-weight': 500, fill: INK, 'letter-spacing': 0.4 }, null, title);
    return el('g', { transform: `translate(${x} ${VY})` });
  }
  /* 1 · co-occurrence on a grid: cells with the plant, with the bee, and shared */
  (function () {
    const g = vignette(0, 'coocurrencia en la rejilla');
    const n = 10, s = 8.6, ox = 32, oy = 10;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const a = Math.exp(-(((c - 3.5) / 2.4) ** 2 + ((r - 5) / 2.6) ** 2)), b = Math.exp(-(((c - 6) / 2.4) ** 2 + ((r - 4) / 2.8) ** 2));
      const hp = rng() < a * 0.95, hb = rng() < b * 0.9;
      const fill = hp && hb ? INK : hp ? mix(VERDE, '#ffffff', 0.45) : hb ? mix(ORO, '#ffffff', 0.35) : '#ffffff';
      el('rect', { x: f1(ox + c * s), y: f1(oy + r * s), width: s - 0.8, height: s - 0.8, fill, stroke: '#e3eadc', 'stroke-width': 0.4 }, g);
    }
  })();
  /* 2 · niches in environmental space: two kernel densities over the available environment */
  (function () {
    const g = vignette(1, 'nichos en el espacio ambiental');
    el('ellipse', { cx: 75, cy: 50, rx: 56, ry: 34, fill: '#eef2ea', stroke: '#cfdac8', 'stroke-dasharray': '2 2' }, g);
    [[62, 56, VERDE], [90, 42, ORO]].forEach(([cx, cy, col]) => { [1, 0.66, 0.36].forEach((k, j) => el('ellipse', { cx, cy, rx: 28 * k, ry: 17 * k, fill: col, 'fill-opacity': 0.16 + j * 0.08, transform: `rotate(-20 ${cx} ${cy})` }, g)); });
    el('line', { x1: 14, y1: 88, x2: 136, y2: 88, stroke: GRIS, 'stroke-width': 0.8 }, g);
    el('line', { x1: 14, y1: 88, x2: 14, y2: 10, stroke: GRIS, 'stroke-width': 0.8 }, g);
    el('text', { x: 118, y: 20, 'font-family': 'Cormorant, serif', 'font-style': 'italic', 'font-size': 11, fill: INK, 'text-anchor': 'middle' }, g, 'D = 0.41');
  })();
  /* 3 · the mismatch map: an invented coast with cells of plant only, visitor only and both */
  (function () {
    const g = vignette(2, 'mapa de desajuste');
    const s = 5;
    for (let r = 0; r < 17; r++) for (let c = 0; c < 26; c++) {
      const x = c / 25, y = r / 16;
      const land = y < 0.95 - 0.55 * x + 0.12 * Math.sin(8 * x) && y > 0.06 + 0.35 * x * x;
      if (!land) continue;
      const pl = Math.exp(-(((x - 0.45) / 0.25) ** 2 + ((y - 0.5) / 0.3) ** 2)) > 0.35, vi = Math.exp(-(((x - 0.3) / 0.28) ** 2 + ((y - 0.35) / 0.3) ** 2)) > 0.4;
      const fill = pl && vi ? VERDE : pl ? OXIDO : vi ? mix(ORO, '#ffffff', 0.3) : '#e6ece2';
      el('rect', { x: 10 + c * s, y: 6 + r * s, width: s - 0.3, height: s - 0.3, fill }, g);
    }
  })();
  /* 4 · the visit network: plants below, visitors above, links weighted by visits */
  (function () {
    const g = vignette(3, 'red de visitas');
    const P = 5, V = 7, py = 78, vy = 18;
    const px = i => 24 + i * 25.5, vx = j => 16 + j * 19.5;
    for (let i = 0; i < P; i++) for (let j = 0; j < V; j++) {
      const w = Math.max(0, 1 - Math.abs(i / (P - 1) - j / (V - 1)) * 1.6 + 0.25 * randn());
      if (w > 0.2) el('line', { x1: px(i), y1: py, x2: vx(j), y2: vy, stroke: j === 0 ? ORO : GRIS, 'stroke-width': f1(0.4 + w * 2), 'stroke-opacity': 0.55 }, g);
    }
    for (let j = 0; j < V; j++) el('rect', { x: vx(j) - 5, y: vy - 8, width: 10, height: 8, rx: 2, fill: j === 0 ? ORO : mix(ORO, '#ffffff', 0.45) }, g);
    for (let i = 0; i < P; i++) el('rect', { x: px(i) - 7, y: py, width: 14, height: 8, rx: 2, fill: VERDE }, g);
  })();

  /* ---------------------------------------------------------------- author and edition */
  const foot = el('g', { 'text-anchor': 'middle', 'font-family': 'Cormorant, serif' });
  el('text', { x: W / 2, y: 1052, 'font-size': 19, 'font-weight': 600, fill: INK, 'letter-spacing': 0.5 }, foot, 'Luis Ángel Barrera-Guzmán');
  el('text', { x: W / 2, y: 1074, 'font-family': 'Jost, sans-serif', 'font-size': 9.5, fill: GRIS, 'letter-spacing': 2.4 }, foot, 'PRIMERA EDICIÓN · 2026 · VERSIÓN 1.2');
})();
</script>
</body>
</html>
