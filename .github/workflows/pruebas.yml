# Corre las pruebas del motor y la validación contra R en cada cambio.
# Las referencias de R ya vienen calculadas en validation/*/ref_*.js: aquí no se instala R.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas y validación en un navegador sin ventana
        run: node .github/scripts/pruebas.mjs
